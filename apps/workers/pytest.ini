[pytest]
# `pythonpath = .` puts the package root (this directory) on sys.path.
#
# Without it, pytest's default "prepend" import mode inserts the directory containing the test
# FILE — apps/workers/tests — and nothing else, so `import wcad_workers` fails no matter where
# pytest is invoked from. Because pytest resolves this relative to rootdir, and rootdir is this
# directory (it holds this ini file), it works identically for `pytest` inside the container at
# /app and for `pytest apps/workers` from the repo root in CI.
pythonpath = .
testpaths = tests

# Integration suites skip themselves when DATABASE_URL is absent rather than failing, so a plain
# `pytest` run stays useful outside the stack. Registered here so the reason is greppable.
markers =
    integration: requires a real PostgreSQL (skipped unless DATABASE_URL is set)
