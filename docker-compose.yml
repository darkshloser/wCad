# Development stack. Everything runs in containers; nothing needs to be installed on the host
# beyond Docker itself.
#
#   make up      start the whole stack
#   make test    run the test suite in a container
#   make down    stop everything
#
# Production differences (TLS, replicas, PgBouncer, resource limits) live in
# docker-compose.prod.yml, which overlays this file.

name: wcad

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wcad}
      POSTGRES_USER: ${POSTGRES_USER:-wcad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wcad_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgis/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wcad} -d ${POSTGRES_DB:-wcad}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Valkey, not Redis. Redis left BSD in March 2024 (RSALv2/SSPL, plus AGPLv3 from Redis 8),
  # none of which sits comfortably under a commercially licensed product. Valkey is the Linux
  # Foundation fork of Redis 7.2.4, still BSD-3-Clause and wire-compatible.
  # See THIRD-PARTY-LICENSES.md.
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage is a plain mounted volume behind the ObjectStore interface.
  #
  # MinIO was the obvious choice and is deliberately not used: it is AGPL-3.0, and the project
  # was archived in April 2026 after entering maintenance mode. For a single on-premise install
  # a filesystem volume is simpler to run and to back up than an object store. If S3 semantics
  # become necessary (horizontally scaling the tile cold cache), add SeaweedFS (Apache-2.0)
  # as an ObjectStore adapter rather than reintroducing MinIO.

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}
      VITE_TILE_SERVICE_URL: http://localhost:${TILES_PORT:-3001}
    command: pnpm --filter @wcad/web dev

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    depends_on:
      postgis:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - objectstore:/var/lib/wcad/objects
    environment:
      OBJECT_STORE_PATH: /var/lib/wcad/objects
      DATABASE_URL: postgres://${POSTGRES_USER:-wcad}:${POSTGRES_PASSWORD:-wcad_dev_password}@postgis:5432/${POSTGRES_DB:-wcad}
      VALKEY_URL: redis://valkey:6379
      PORT: 3000

  # Deployed separately from the API so heavy read traffic cannot starve edit traffic, and so
  # it can be scaled by replica count alone. Reads from a replica when one is configured.
  tiles:
    build:
      context: .
      dockerfile: docker/tiles.Dockerfile
      target: dev
    depends_on:
      postgis:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "${TILES_PORT:-3001}:3001"
    volumes:
      - .:/app
      - tiles_node_modules:/app/node_modules
      - objectstore:/var/lib/wcad/objects
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wcad}:${POSTGRES_PASSWORD:-wcad_dev_password}@postgis:5432/${POSTGRES_DB:-wcad}
      VALKEY_URL: redis://valkey:6379
      TILE_CACHE_PATH: /var/lib/wcad/objects/tiles
      PROJECT_SRID: ${PROJECT_SRID:-32635}
      PORT: 3001

  workers:
    build:
      context: .
      dockerfile: docker/workers.Dockerfile
      # The dev target carries pytest, so `wcad.ps1 test-workers` can run the Python suites
      # against the real database without a second image.
      target: dev
    depends_on:
      postgis:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./apps/workers:/app
      - ./fixtures:/fixtures
      # Read-only: the workers apply migrations but must never be able to edit them.
      - ./docker/postgis/migrations:/migrations:ro
      - objectstore:/var/lib/wcad/objects
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wcad}:${POSTGRES_PASSWORD:-wcad_dev_password}@postgis:5432/${POSTGRES_DB:-wcad}
      VALKEY_URL: redis://valkey:6379
      # So a finished import invalidates the tile service's cached project extents; without it a
      # freshly imported project keeps the extent it had when the service last looked.
      TILES_URL: http://tiles:3001
      WEB_URL: http://localhost:${WEB_PORT:-5173}
      PROJECT_SRID: ${PROJECT_SRID:-32635}
    command: ["python", "-m", "wcad_workers.main", "worker"]

  # One-shot test runner. The Docker socket is mounted because the integration suites use
  # Testcontainers, which starts a real PostGIS container — running those inside a container
  # requires access to the host daemon. Unit tests do not need it, but sharing one image keeps
  # the tooling simple.
  test:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: dev
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wcad}:${POSTGRES_PASSWORD:-wcad_dev_password}@postgis:5432/${POSTGRES_DB:-wcad}
      VALKEY_URL: redis://valkey:6379
      # Testcontainers publishes ports on the host, so reach them via the host gateway.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: pnpm test
    profiles: ["tools"]

  # Playwright runs against the already-running web and tile services.
  e2e:
    image: mcr.microsoft.com/playwright:v1.48.2-jammy
    working_dir: /app
    depends_on:
      - web
      - tiles
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    environment:
      WCAD_WEB_URL: http://web:5173
      WCAD_TILES_URL: http://tiles:3001
    command: sh -c "corepack enable && pnpm install && pnpm --filter @wcad/web exec playwright test"
    profiles: ["tools"]

volumes:
  pgdata:
  valkeydata:
  objectstore:
  web_node_modules:
  api_node_modules:
  tiles_node_modules:
  test_node_modules:
  e2e_node_modules:
